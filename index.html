<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Little Garage</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    background: linear-gradient(180deg, #a6d8ef 0%, #fdf4e3 55%); color: #4a5058;
    font-family: 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif;
  }
  h1 { font-size: clamp(34px, 6vw, 60px); margin: 8vh 0 4px; color: #4a5058; }
  p.sub { margin: 0 0 42px; font-size: 20px; color: #7a828e; }
  .games { display: grid; gap: 26px; grid-template-columns: repeat(auto-fit, minmax(260px, 320px)); width: min(92vw, 1100px); }
  a.game {
    display: flex; flex-direction: column; align-items: center; gap: 10px; text-decoration: none;
    background: #fffdf8; border-radius: 30px; padding: 34px 22px 28px;
    box-shadow: 0 6px 0 rgba(74, 80, 88, .18); transition: transform .15s ease;
  }
  a.game:hover { transform: translateY(-6px) rotate(-.5deg); }
  a.game .icon { font-size: 84px; line-height: 1; }
  a.game .t { font-size: 24px; font-weight: 800; color: #4a5058; text-align: center; }
  a.game .b { font-size: 15px; color: #7a828e; text-align: center; line-height: 1.45; }
  footer { margin-top: auto; padding: 26px; font-size: 13px; color: #9aa2ad; }
</style>
</head>
<body>
<h1>My Little Garage</h1>
<p class="sub">Pick a game! 🚗💨</p>
<div class="games" id="games"></div>
<footer>plug in the steering wheel and go · built with three.js</footer>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
