<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Endless City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fdf4e3; }
  canvas { display: block; }
  :root { --ink: #4a5058; --ink-soft: #5a6472; --cream: rgba(255, 252, 244, .92); --teal: #63b0a8; }
  /* the top-right corner: the clock beside the stats pill */
  #hudTR {
    position: fixed; top: 12px; right: 12px; z-index: 9;
    display: flex; flex-direction: row; align-items: flex-start; gap: 10px; pointer-events: none;
  }
  /* the game clock (G10): only an hour hand, a sun or moon on the face */
  #clock {
    width: 64px; height: 64px; border-radius: 50%; flex: none;
    background: var(--cream); box-shadow: 0 3px 0 rgba(74, 80, 88, .14);
  }
  #clock svg { display: block; width: 100%; height: 100%; }
  #mission {
    padding: 12px 20px; border-radius: 22px; min-width: 220px; text-align: right;
    background: var(--cream); color: var(--ink-soft);
    font: 600 14px/1.6 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    box-shadow: 0 3px 0 rgba(74, 80, 88, .14);
  }
  /* (the call's icon and how near, side by side — stacked they took twice
     the height off the top of the view) */
  #guide {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 8;
    display: flex; flex-direction: row; align-items: center; gap: 10px;
    pointer-events: none; white-space: nowrap;
  }
  /* the badge says WHAT the call is (its icon) and how near (the dots);
     the way there is the 3D arrow over the vehicle — one arrow, not two */
  #guideBadge {
    position: relative;
    width: clamp(56px, 8.5vh, 84px); height: clamp(56px, 8.5vh, 84px);
    border-radius: 50%;
    background: var(--cream);
    border: 3px solid #fffdf8;
    box-shadow: 0 4px 0 rgba(74, 80, 88, .18);
    display: grid; place-items: center;
    animation: badgeBob 1.6s ease-in-out infinite;
  }
  #guideBadge::before { content: none; }
  @keyframes badgeBob { 50% { transform: translateY(-4px); } }
  #guideIcon { font-size: clamp(28px, 4.6vh, 46px); line-height: 1; }
  #guideArrow { display: none; }
  #guideDist {
    padding: 7px 22px; border-radius: 999px; background: var(--cream);
    font: 800 clamp(18px, 3.4vh, 30px)/1 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif;
    color: var(--teal); letter-spacing: 5px;
    box-shadow: 0 3px 0 rgba(74, 80, 88, .14);
  }
  #guideWait {
    padding: 9px 24px; border-radius: 999px; background: var(--cream);
    font: 800 clamp(16px, 3vh, 26px)/1.2 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif;
    color: var(--ink); text-align: center; max-width: 62vw;
    box-shadow: 0 3px 0 rgba(74, 80, 88, .14);
  }
  #guideDist .m { font-size: .55em; margin-left: 12px; letter-spacing: 1px; color: var(--ink-soft); vertical-align: middle; }
  #guideDist:empty, #guideWait:empty { display: none; }
  /* what's on board (G16): a patient, a thief, a car, a load of trash */
  #cargo {
    display: none; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; border-radius: 999px;
    background: var(--cream); box-shadow: 0 3px 0 rgba(74, 80, 88, .14);
  }
  #cargo.on { display: flex; }
  #cargoIcon { font-size: clamp(22px, 3.6vh, 34px); line-height: 1; }
  #cargo .bar { width: clamp(36px, 6vh, 60px); height: 10px; border-radius: 5px; background: rgba(74, 80, 88, .15); overflow: hidden; }
  #cargoFill { height: 100%; width: 100%; background: #6fb86a; border-radius: 5px; transition: width .4s; }
  /* the prompt keeps out of the way — never over the vehicle or a scene's
     action: a compact pill in the bottom-left corner, above the siren
     button (right in the corner when there's no siren, or in a scene) */
  #prompt {
    position: fixed; left: 14px; bottom: 118px; z-index: 8; display: none;
    padding: clamp(6px, 1.4vh, 14px) clamp(12px, 2vw, 26px); border-radius: clamp(12px, 2vh, 22px); background: var(--cream);
    font: 800 clamp(14px, 2.6vh, 26px) 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif; color: var(--ink); text-align: left; pointer-events: none;
    white-space: nowrap; opacity: .94;
    box-shadow: 0 3px 0 rgba(74, 80, 88, .14);
  }
  #prompt .bar { width: min(280px, 22vw); height: clamp(8px, 1.5vh, 14px); background: rgba(74, 80, 88, .12); border-radius: 12px; margin-top: clamp(4px, 0.9vh, 10px); overflow: hidden; }
  #prompt .bar > div { height: 100%; background: var(--teal); width: 0%; }
  body.no-siren #prompt, body.in-scene #prompt { bottom: 5.5vh; }
  #camLabel {
    position: fixed; bottom: 4vh; left: 50%; transform: translateX(-50%); z-index: 9;
    padding: 10px 24px; border-radius: 999px; background: var(--cream); color: var(--ink);
    font: 800 20px 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif;
    opacity: 0; transition: opacity .4s; pointer-events: none;
    box-shadow: 0 3px 0 rgba(74, 80, 88, .14);
  }
  /* mission scenes: a soft cream fade between the world and the scene; the
     map and the siren step aside while a scene plays */
  #fade {
    position: fixed; inset: 0; z-index: 7; background: #fdf4e3;
    opacity: 0; pointer-events: none;
  }
  body.in-scene #minimap, body.in-scene #sirenBtn { display: none; }
  #minimap {
    position: fixed; right: 12px; bottom: 12px; z-index: 9;
    width: clamp(160px, 30vh, 260px); height: clamp(160px, 30vh, 260px);
    border-radius: 20px; border: 4px solid #fffdf8;
    box-shadow: 0 3px 0 rgba(74, 80, 88, .18);
  }
  #sirenBtn {
    position: fixed; left: 14px; bottom: 52px; z-index: 12;
    display: flex; align-items: center; gap: 9px;
    padding: 11px 20px 11px 15px; border-radius: 999px; cursor: pointer;
    background: var(--cream); color: var(--ink); border: 3px solid #fffdf8;
    box-shadow: 0 4px 0 rgba(74, 80, 88, .18);
    font: 800 17px 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 2px; touch-action: manipulation;
  }
  #sirenBtn .ic { font-size: 24px; line-height: 1; }
  #sirenBtn.on {
    background: #e25c5c; color: #fffdf8;
    animation: sirenPulse .7s ease-out infinite;
  }
  @keyframes sirenPulse {
    0%   { box-shadow: 0 4px 0 rgba(163, 42, 42, .45), 0 0 0 0 rgba(226, 92, 92, .55); }
    100% { box-shadow: 0 4px 0 rgba(163, 42, 42, .45), 0 0 0 16px rgba(226, 92, 92, 0); }
  }
  /* back to the garage: click it, press Esc, or hold the wheel's
     start / select button (the ring fills while it's held) */
  #homeBtn {
    position: fixed; top: 10px; left: 12px; z-index: 12;
    width: 60px; height: 60px; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center; font-size: 30px; line-height: 1;
    background: conic-gradient(var(--teal) calc(var(--hold, 0) * 1turn), var(--cream) 0);
    border: 3px solid #fffdf8; box-shadow: 0 4px 0 rgba(74, 80, 88, .18);
    touch-action: manipulation;
  }
  #homeBtn span { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--cream); }
  body.in-scene #homeBtn { display: none; }
  /* sound on / off, beside the home button (G11), and the music (G12) */
  #muteBtn, #musicBtn {
    position: fixed; top: 14px; left: 82px; z-index: 12;
    width: 52px; height: 52px; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center; font-size: 24px; line-height: 1;
    background: var(--cream); border: 3px solid #fffdf8; box-shadow: 0 4px 0 rgba(74, 80, 88, .18);
    touch-action: manipulation;
  }
  #musicBtn { left: 144px; }
  /* (off: the note faded and struck through) */
  #musicBtn.off { opacity: .55; background: linear-gradient(135deg, transparent 46%, #e25c5c 46%, #e25c5c 54%, transparent 54%), var(--cream); }
  /* the loading card: what's happening, a bar with the vehicle driving
     along it, and about how long is left */
  #loading {
    position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    background: radial-gradient(ellipse at 50% 38%, #fffaf0 0%, #fdf4e3 40%, #bfe3f0 100%);
    font-family: 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif; color: var(--ink);
    transition: opacity .6s ease;
  }
  #loading.gone { opacity: 0; pointer-events: none; }
  #loading .isle { font-size: clamp(64px, 14vh, 130px); line-height: 1; animation: isleBob 2.2s ease-in-out infinite; }
  @keyframes isleBob { 50% { transform: translateY(-10px) rotate(-3deg); } }
  #loading .label { font-size: clamp(22px, 4.2vh, 40px); font-weight: 800; letter-spacing: .5px; }
  #loading .track {
    position: relative; width: min(760px, 82vw); height: clamp(22px, 4vh, 36px);
    border-radius: 999px; background: rgba(74, 80, 88, .12); box-shadow: inset 0 3px 0 rgba(74, 80, 88, .1);
  }
  #loading .fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px;
    background: repeating-linear-gradient(-45deg, #63b0a8 0 18px, #74c2b9 18px 36px);
    background-size: 51px 100%; animation: stripes 1s linear infinite;
    transition: width .25s ease;
  }
  @keyframes stripes { to { background-position: 51px 0; } }
  #loading .car {
    position: absolute; top: 50%; left: 0; transform: translate(-50%, -78%) scaleX(-1);
    font-size: clamp(38px, 7vh, 64px); line-height: 1; transition: left .25s ease;
    filter: drop-shadow(0 3px 0 rgba(74, 80, 88, .18));
  }
  #loading .eta { font-size: clamp(16px, 2.6vh, 24px); font-weight: 700; color: var(--ink-soft); min-height: 1.2em; }
  /* a neighbour still being built as the kid drives up to it */
  #islandPill {
    position: fixed; left: 50%; bottom: 3.2vh; transform: translateX(-50%); z-index: 9; display: none;
    padding: 8px 18px; border-radius: 999px; background: var(--cream); color: var(--ink);
    font: 800 clamp(13px, 2.2vh, 20px) 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif;
    box-shadow: 0 3px 0 rgba(74, 80, 88, .14); pointer-events: none; white-space: nowrap;
  }
  #islandPill .mini { display: inline-block; vertical-align: middle; width: 90px; height: 9px; margin-left: 10px; border-radius: 9px; background: rgba(74, 80, 88, .14); overflow: hidden; }
  #islandPill .mini > div { height: 100%; width: 0; background: var(--teal); transition: width .3s; }
</style>
</head>
<body>
<div id="hudTR">
  <div id="clock" data-i18n-title="city.clock">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle id="clockFace" cx="50" cy="50" r="44" fill="#dff1fb" stroke="#4a5058" stroke-width="4" />
      <g id="clockTicks" stroke="#4a5058" stroke-width="5" stroke-linecap="round">
        <line x1="50" y1="11" x2="50" y2="19" /><line x1="89" y1="50" x2="81" y2="50" />
        <line x1="50" y1="89" x2="50" y2="81" /><line x1="11" y1="50" x2="19" y2="50" />
      </g>
      <g id="clockSun" transform="translate(50 70)">
        <g stroke="#f5a623" stroke-width="3" stroke-linecap="round">
          <line x1="0" y1="-13" x2="0" y2="-10" /><line x1="0" y1="13" x2="0" y2="10" />
          <line x1="-13" y1="0" x2="-10" y2="0" /><line x1="13" y1="0" x2="10" y2="0" />
          <line x1="-9" y1="-9" x2="-7" y2="-7" /><line x1="9" y1="9" x2="7" y2="7" />
          <line x1="-9" y1="9" x2="-7" y2="7" /><line x1="9" y1="-9" x2="7" y2="-7" />
        </g>
        <circle r="7" fill="#ffc83d" />
      </g>
      <clipPath id="clockMoonClip"><circle r="9" /></clipPath>
      <g id="clockMoon" transform="translate(50 70)" style="display:none">
        <circle r="9" fill="#f4f1e2" />
        <circle id="clockMoonShade" r="9.5" cx="5" fill="#2a3a66" clip-path="url(#clockMoonClip)" />
      </g>
      <line id="clockHand" x1="50" y1="50" x2="50" y2="22" stroke="#e25c5c" stroke-width="7" stroke-linecap="round" />
      <circle cx="50" cy="50" r="6" fill="#4a5058" />
    </svg>
  </div>
  <div id="mission" data-i18n="city.loadingPanel"></div>
</div>
<div id="guide">
  <div id="cargo"><span id="cargoIcon"></span><div class="bar"><div id="cargoFill"></div></div></div>
  <div id="guideBadge"><span id="guideIcon"></span>
    <svg id="guideArrow" width="190" height="190" viewBox="0 0 100 100">
      <path d="M50 14 L75 46 L62 46 L62 84 L38 84 L38 46 L25 46 Z"
            fill="#e25c5c" stroke="#fffdf8" stroke-width="13" stroke-linejoin="round"/>
      <path d="M50 14 L75 46 L62 46 L62 84 L38 84 L38 46 L25 46 Z"
            fill="none" stroke="#c94b4b" stroke-width="3" stroke-linejoin="round"/>
    </svg>
  </div>
  <div id="guideDist"></div><div id="guideWait"></div>
</div>
<div id="prompt"><span id="promptText"></span><div class="bar"><div id="promptFill"></div></div></div>
<div id="camLabel"></div>
<div id="fade"></div>
<button id="sirenBtn" type="button"><span class="ic">🚨</span><span data-i18n="city.siren"></span></button>
<canvas id="minimap" width="256" height="256"></canvas>
<button id="homeBtn" type="button" data-i18n-title="city.home"><span>🏠</span></button>
<button id="muteBtn" type="button" data-i18n-title="city.mute">🔊</button>
<button id="musicBtn" type="button" data-i18n-title="city.music">🎵</button>
<div id="islandPill"><span class="t"></span><span class="mini"><div></div></span></div>
<div id="loading">
  <div class="isle">🏝️</div>
  <div class="label" data-i18n="load.ready"></div>
  <div class="track"><div class="fill"></div><div class="car"></div></div>
  <div class="eta"></div>
</div>
<script type="module" src="../src/games/city/index.ts"></script>
</body>
</html>
