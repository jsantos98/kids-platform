<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Little Garage</title>
<style>
  :root {
    --ink: #4a5058; --ink-soft: #6a7380; --cream: rgba(255, 252, 244, .94); --accent: #e25c5c;
    font-family: 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cbe7f2; color: var(--ink); user-select: none; }
  canvas { display: block; }

  /* ---- title ---- */
  #title {
    position: fixed; top: 3.2vh; left: 50%; transform: translateX(-50%); z-index: 5;
    display: flex; align-items: center; gap: 14px; pointer-events: none;
    padding: 10px 30px; border-radius: 999px; background: var(--cream);
    box-shadow: 0 5px 0 rgba(74, 80, 88, .14);
    font-weight: 900; font-size: clamp(22px, 4.2vh, 40px); letter-spacing: .5px; white-space: nowrap;
  }
  #title .garage { font-size: 1.25em; }
  #stars {
    position: fixed; top: 3.2vh; right: 2.2vw; z-index: 5; pointer-events: none;
    padding: 10px 20px; border-radius: 999px; background: var(--cream); box-shadow: 0 4px 0 rgba(74, 80, 88, .14);
    font-weight: 800; font-size: clamp(15px, 2.4vh, 22px); color: var(--ink-soft); white-space: nowrap;
  }

  /* ---- the chosen vehicle's name ---- */
  #name {
    position: fixed; left: 50%; bottom: calc(24vh + 30px); transform: translateX(-50%); z-index: 5;
    display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
  }
  #name .t {
    padding: 8px 34px; border-radius: 999px; background: var(--cream); white-space: nowrap;
    font-weight: 900; font-size: clamp(30px, 6.4vh, 64px); letter-spacing: 1px; color: var(--ink);
    box-shadow: 0 6px 0 var(--sel, #e25c5c);
    animation: pop .35s cubic-bezier(.3, 1.6, .5, 1);
  }
  #name .b { font-weight: 700; font-size: clamp(15px, 2.5vh, 24px); color: var(--ink-soft); text-shadow: 0 1px 0 #fffdf8; }
  @keyframes pop { from { transform: scale(.7); opacity: .2; } to { transform: scale(1); opacity: 1; } }

  /* ---- the cards: a coverflow, the chosen one whole and big in the middle,
     the others turned away and tucked behind each other (main.ts places
     every card every frame, so they grow as they glide to the middle) ---- */
  /* (lifted clear of the key help under it) */
  #carousel { position: fixed; left: 0; right: 0; bottom: calc(5vh + 12px); height: 19vh; z-index: 5;
    perspective: 1100px; perspective-origin: 50% 40%; }
  .vcard {
    position: absolute; left: 50%; top: 50%; width: 16vh; height: 16vh; margin: -8vh 0 0 -8vh;
    cursor: pointer; transform-style: preserve-3d; will-change: transform;
  }
  .vcard .face {
    position: absolute; inset: 0; border-radius: 24%; overflow: hidden; display: grid; place-items: center;
    background:
      radial-gradient(120% 90% at 30% 15%, rgba(255, 255, 255, .55), transparent 55%),
      linear-gradient(160deg, color-mix(in srgb, var(--c) 55%, #fffdf6), color-mix(in srgb, var(--c) 88%, #3d434b));
    box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 60%, #2c3138), 0 10px 22px rgba(40, 46, 54, .28);
    border: 3px solid rgba(255, 253, 246, .85);
    backface-visibility: hidden;
  }
  .vcard .face img { width: 94%; height: 94%; object-fit: contain; pointer-events: none; user-select: none;
    filter: drop-shadow(0 4px 3px rgba(30, 34, 40, .35)); }
  .vcard .face .emo { font-size: 8.5vh; line-height: 1; filter: drop-shadow(0 3px 2px rgba(30, 34, 40, .3)); }
  /* the chosen one: a ring and a glow in its colour */
  .vcard.sel .face {
    border-color: #fffdf6;
    box-shadow: 0 0 0 5px var(--c), 0 0 44px 12px color-mix(in srgb, var(--c) 60%, transparent),
      0 8px 0 color-mix(in srgb, var(--c) 60%, #2c3138), 0 16px 30px rgba(40, 46, 54, .32);
  }

  /* ---- how to drive the menu ---- */
  #help {
    position: fixed; left: 2.2vw; top: 3.2vh; z-index: 6; display: flex; align-items: center; gap: 12px;
    padding: 8px 18px 8px 10px; border-radius: 999px; background: var(--cream);
    box-shadow: 0 4px 0 rgba(74, 80, 88, .14); font-weight: 800; font-size: clamp(13px, 2vh, 18px); color: var(--ink-soft);
    pointer-events: none;
  }
  /* (where the hint would run into the centred title — it depends on the
     window and the language's words — it drops below the title row; main.ts
     measures: a fixed 1450 px breakpoint let the Portuguese hint overlap) */
  #help.below { top: calc(3.2vh + clamp(22px, 4.2vh, 40px) * 1.25 + 42px); }
  /* ---- the language switch (for the grown-ups: a click, or the L key) ---- */
  #lang {
    position: fixed; right: 2.2vw; top: calc(3.2vh + clamp(15px, 2.4vh, 22px) * 1.4 + 34px); z-index: 6;
    display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: var(--cream);
    box-shadow: 0 4px 0 rgba(74, 80, 88, .14);
  }
  #lang button {
    border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; background: transparent;
    font-family: inherit; font-weight: 800; font-size: clamp(13px, 1.9vh, 17px); color: var(--ink-soft);
  }
  #lang button.on { background: var(--sel, #e25c5c); color: #fffdf8; }
  /* the music's switch (off: faded, struck through) */
  #lang button.music { padding: 6px 10px; }
  #lang button.music.off { opacity: .55; background: linear-gradient(135deg, transparent 46%, #e25c5c 46%, #e25c5c 54%, transparent 54%); }
  #wheel { width: clamp(38px, 6vh, 58px); height: clamp(38px, 6vh, 58px); transition: transform .08s linear; }

  /* ---- the game's keys, for the grown-up setting things up ---- */
  #keys {
    /* (centred by margins, not left 50% + translate: that capped its width at
       half the window and wrapped it on every screen under ~1900 px) */
    position: fixed; bottom: 0.9vh; left: 12px; right: 12px; margin: 0 auto; width: fit-content; z-index: 6;
    box-sizing: border-box; text-align: center; pointer-events: none;
    padding: 6px 20px; border-radius: 999px; background: var(--cream);
    box-shadow: 0 3px 0 rgba(74, 80, 88, .12);
    font-weight: 700; font-size: clamp(12px, 1.8vh, 16px); line-height: 1.45; color: var(--ink-soft);
  }
  #keys b { color: var(--ink); }
  /* (each key with its action stays together; the list wraps between them on
     a narrow screen, and the carousel steps up over the second line) */
  #keys .k { white-space: nowrap; }
  #keys .lead { margin-right: 4px; }
  @media (max-width: 760px) {
    #keys { border-radius: 18px; }
    #carousel { bottom: calc(5vh + 58px); }
    #name { bottom: calc(24vh + 76px); }
  }
  #go {
    position: fixed; right: 3vw; top: 42vh; z-index: 6; cursor: pointer;
    display: flex; align-items: center; gap: 12px; border: 4px solid #fffdf8; border-radius: 999px;
    padding: clamp(10px, 1.8vh, 18px) clamp(26px, 3.4vw, 46px);
    background: var(--sel, #e25c5c); color: #fffdf8; font-weight: 900; font-size: clamp(24px, 4.6vh, 44px); font-family: inherit;
    box-shadow: 0 6px 0 rgba(74, 80, 88, .25);
    animation: goPulse 1.3s ease-in-out infinite;
  }
  #go .pedal { font-size: .8em; }
  @keyframes goPulse { 50% { transform: scale(1.06); } }

  /* ---- the wipe into the game ---- */
  #wipe {
    position: fixed; inset: 0; z-index: 20; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 45%, #fffaf0, #fdf4e3 60%, #bfe3f0);
    display: grid; place-items: center; font-size: 16vh; transition: opacity .5s ease;
  }
  #wipe.on { opacity: 1; }

  /* ---- the grown-ups' sound settings (⚙️ beside the language, or O) ---- */
  #settings {
    position: fixed; inset: 0; z-index: 30; display: none; place-items: center;
    background: rgba(61, 67, 75, .35);
  }
  #settings.on { display: grid; }
  #settings .card {
    min-width: min(460px, 90vw); padding: 22px 28px 20px; border-radius: 28px; background: var(--cream);
    box-shadow: 0 8px 0 rgba(74, 80, 88, .18); display: flex; flex-direction: column; gap: 14px;
  }
  #settings h2 { margin: 0 0 4px; font-size: clamp(20px, 3vh, 28px); color: var(--ink); }
  #settings label { display: grid; grid-template-columns: 11em 1fr 3em; align-items: center; gap: 12px;
    font-weight: 800; font-size: clamp(14px, 2vh, 18px); color: var(--ink-soft); }
  #settings input[type=range] { width: 100%; accent-color: var(--sel, #e25c5c); height: 28px; }
  #settings output { text-align: right; font-variant-numeric: tabular-nums; }
  #settings button { align-self: flex-end; border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer;
    background: var(--sel, #e25c5c); color: #fffdf8; font: inherit; font-weight: 800; }
  #lang button.gear { padding: 6px 10px; }
  #settings .quality { display: grid; grid-template-columns: 11em 1fr; align-items: center; gap: 12px;
    font-weight: 800; font-size: clamp(14px, 2vh, 18px); color: var(--ink-soft); }
  #settings .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  #settings .seg button { align-self: auto; padding: 8px 14px; background: #e9e2d4; color: var(--ink);
    text-transform: capitalize; }
  #settings .seg button.on { background: var(--sel, #e25c5c); color: #fffdf8; }
  #settings .note { margin: -4px 0 0; font-size: clamp(12px, 1.6vh, 14px); color: var(--ink-soft); max-width: 36em; }
</style>
</head>
<body>
<div id="title"><span class="garage">🏠</span> <span data-i18n="garage.title"></span></div>
<div id="stars"></div>
<div id="name"><div class="t"></div><div class="b"></div></div>
<div id="carousel"></div>
<div id="help">
  <svg id="wheel" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="42" fill="none" stroke="#4a5058" stroke-width="10"/>
    <circle cx="50" cy="50" r="10" fill="#4a5058"/>
    <path d="M50 50 L14 58 M50 50 L86 58 M50 50 L50 90" stroke="#4a5058" stroke-width="9" stroke-linecap="round"/>
    <circle cx="50" cy="8" r="6" fill="#e25c5c"/>
  </svg>
  <span data-i18n="garage.help"></span>
</div>
<div id="lang" role="group" data-i18n-title="garage.language"></div>
<button id="go" type="button"><span data-i18n="garage.go"></span><span class="pedal">🦶</span></button>
<div id="keys"></div>
<div id="wipe"></div>
<div id="settings" role="dialog" data-i18n-title="settings.title">
  <div class="card">
    <h2 data-i18n="settings.title"></h2>
    <label><span data-i18n="settings.voice"></span><input type="range" min="0" max="100" data-vol="voice"><output></output></label>
    <label><span data-i18n="settings.music"></span><input type="range" min="0" max="100" data-vol="music"><output></output></label>
    <label><span data-i18n="settings.bg"></span><input type="range" min="0" max="100" data-vol="bg"><output></output></label>
    <label><span data-i18n="settings.engine"></span><input type="range" min="0" max="100" data-vol="engine"><output></output></label>
    <div class="quality"><span data-i18n="settings.quality"></span><div class="seg" role="radiogroup">
      <button type="button" role="radio" data-quality="auto" data-i18n="settings.quality.auto"></button>
      <button type="button" role="radio" data-quality="minimal" data-i18n="settings.quality.minimal"></button>
      <button type="button" role="radio" data-quality="low" data-i18n="settings.quality.low"></button>
      <button type="button" role="radio" data-quality="medium" data-i18n="settings.quality.medium"></button>
      <button type="button" role="radio" data-quality="high" data-i18n="settings.quality.high"></button>
    </div></div>
    <p class="note" data-i18n="settings.qualityNote"></p>
    <div class="quality"><span data-i18n="settings.auto"></span><div class="seg" role="radiogroup">
      <button type="button" role="radio" data-auto="0" data-i18n="settings.auto.off"></button>
      <button type="button" role="radio" data-auto="1" data-i18n="settings.auto.on"></button>
    </div></div>
    <p class="note" data-i18n="settings.autoNote"></p>
    <div class="quality"><span data-i18n="settings.wheel"></span><div class="seg">
      <button type="button" id="wheelBtn" data-i18n="settings.wheel.open"></button>
    </div></div>
    <button id="settingsClose" type="button" data-i18n="settings.close"></button>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
