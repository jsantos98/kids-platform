<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Endless City — Fire Missions</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fdf4e3; }
  canvas { display: block; }
  :root { --ink: #4a5058; --ink-soft: #5a6472; --cream: rgba(255, 252, 244, .92); --teal: #63b0a8; }
  #hint {
    position: fixed; top: 12px; left: 12px; z-index: 9;
    padding: 10px 18px; border-radius: 999px;
    background: var(--cream); color: var(--ink-soft);
    font: 600 13px/1.5 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    box-shadow: 0 3px 0 rgba(74, 80, 88, .14);
  }
  #hint b { color: var(--ink); }
  #mission {
    position: fixed; top: 12px; right: 12px; z-index: 9;
    padding: 12px 20px; border-radius: 22px; min-width: 220px; text-align: right;
    background: var(--cream); color: var(--ink-soft);
    font: 600 14px/1.6 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    box-shadow: 0 3px 0 rgba(74, 80, 88, .14);
  }
  #guide {
    position: fixed; top: 2vh; left: 50%; transform: translateX(-50%); z-index: 8;
    text-align: center; pointer-events: none;
  }
  #guideIcon { font-size: 88px; line-height: 1.15; text-shadow: 0 4px 10px rgba(74, 80, 88, .3); }
  #guideArrow {
    display: block; margin: 0 auto 4px;
    filter: drop-shadow(0 5px 0 rgba(74, 80, 88, .3)) drop-shadow(0 0 22px rgba(74, 80, 88, .22));
    transform-origin: 50% 50%;
    animation: arrowPulse 1.1s ease-in-out infinite;
  }
  @keyframes arrowPulse { 50% { opacity: 0.72; } }
  #guideDist {
    font-size: 72px; font-weight: 800; color: #fff; letter-spacing: 2px;
    text-shadow: 0 4px 0 rgba(74, 80, 88, .38), 0 0 24px rgba(74, 80, 88, .3);
  }
  #guideWait { font: 800 30px 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif; color: #fff; text-shadow: 0 2px 0 rgba(74, 80, 88, .32); }
  #prompt {
    position: fixed; bottom: 13vh; left: 50%; transform: translateX(-50%); z-index: 8; display: none;
    padding: 26px 52px; border-radius: 32px; background: var(--cream);
    font: 800 52px 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif; color: var(--ink); text-align: center; pointer-events: none;
    box-shadow: 0 5px 0 rgba(74, 80, 88, .16);
  }
  #prompt .bar { width: 560px; height: 32px; background: rgba(74, 80, 88, .12); border-radius: 16px; margin-top: 16px; overflow: hidden; }
  #prompt .bar > div { height: 100%; background: var(--teal); width: 0%; }
  #camLabel {
    position: fixed; bottom: 4vh; left: 50%; transform: translateX(-50%); z-index: 9;
    padding: 10px 24px; border-radius: 999px; background: var(--cream); color: var(--ink);
    font: 800 20px 'Segoe UI Rounded', 'Segoe UI', system-ui, sans-serif;
    opacity: 0; transition: opacity .4s; pointer-events: none;
    box-shadow: 0 3px 0 rgba(74, 80, 88, .14);
  }
</style>
</head>
<body>
<div id="hint"><b>W / ↑</b> gas &nbsp; <b>S / ↓</b> brake &nbsp; <b>A D / ← →</b> steer &nbsp; <b>SPACE / A</b> spray / rescue &nbsp; <b>C</b> camera (chase · high · cab) &nbsp; <b>R</b> reset<br>USB wheel: steering axis + triggers work automatically</div>
<div id="mission">loading…</div>
<div id="guide"><span id="guideIcon"></span><br>
  <svg id="guideArrow" width="190" height="190" viewBox="0 0 100 100">
    <path d="M50 5 L80 42 L61 42 L61 95 L39 95 L39 42 L20 42 Z"
          fill="#ffb347" stroke="rgba(20,26,40,.55)" stroke-width="3.5" stroke-linejoin="round"/>
  </svg><div id="guideDist"></div><div id="guideWait"></div></div>
<div id="prompt"><span id="promptText"></span><div class="bar"><div id="promptFill"></div></div></div>
<div id="camLabel"></div>
<script type="module" src="../src/games/city/index.ts"></script>
</body>
</html>
